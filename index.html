<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R.S. Furnitures – Premium Furniture Manufacturer | Rudrapur, Uttarakhand</title>

  <meta name="keywords" content="furniture manufacturer Rudrapur, sofa sets, beds, dining tables, office furniture, school furniture, wooden furniture, steel furniture, custom furniture Uttarakhand" />

  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dark: #9A7A30;
      --black: #0A0A0A;
      --dark: #111111;
      --dark-2: #1A1612;
      --dark-3: #221E18;
      --dark-4: #2C2620;
      --white: #FFFFFF;
      --off-white: #F5F0E8;
      --cream: #EDE0CC;
      --gray: #8A8A8A;
      --gray-light: #C0BAB0;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(201,168,76,0.2);
      --shadow-gold: 0 0 40px rgba(201,168,76,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--black);
      color: var(--off-white);
      overflow-x: hidden;
      line-height: 1.6;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--dark); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }
    ::selection { background: var(--gold); color: var(--black); }

    /* ── UTILITIES ── */
    .section-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.35);
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 3.8vw, 3.1rem);
      font-weight: 600;
      line-height: 1.2;
      color: var(--off-white);
      margin-bottom: 16px;
    }

    .section-title span { color: var(--gold); }

    .section-subtitle {
      font-size: 0.97rem;
      color: var(--gray-light);
      max-width: 560px;
      line-height: 1.8;
    }

    .gold-line {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin: 20px 0 40px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--black);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-primary:hover::after { opacity: 1; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(201,168,76,0.4); }
    .btn-primary > * { position: relative; z-index: 1; }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 32px;
      background: transparent;
      color: var(--off-white);
      font-weight: 500;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-wa:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(37,211,102,0.35); }

    /* ── NAVBAR ── */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 0 5%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.4s ease;
    }

    #navbar.scrolled {
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(201,168,76,0.15);
      height: 66px;
    }

    .nav-logo-main {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .nav-logo-sub {
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gray);
      margin-top: 3px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-light);
      text-decoration: none;
      position: relative;
      transition: color 0.3s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1px;
      background: var(--gold);
      transition: width 0.3s;
    }

    .nav-links a:hover { color: var(--gold); }
    .nav-links a:hover::after { width: 100%; }

    .nav-cta { display: flex; align-items: center; gap: 14px; }

    .nav-phone {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold);
      text-decoration: none;
      white-space: nowrap;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 26px; height: 2px;
      background: var(--gold);
      border-radius: 2px;
      transition: all 0.3s;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 66px; left: 0; right: 0;
      background: rgba(10,10,10,0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 28px 5%;
      flex-direction: column;
      gap: 20px;
      z-index: 999;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu a {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-light);
      text-decoration: none;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: color 0.3s;
    }

    .mobile-menu a:hover { color: var(--gold); }
    .mobile-menu a:last-child { border-bottom: none; }

    /* ── HERO ── */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(10,10,10,0.93) 0%, rgba(28,18,10,0.87) 55%, rgba(10,10,10,0.82) 100%),
        url('https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=1800&q=85') center/cover no-repeat;
      transform: scale(1.05);
      transition: transform 8s ease;
    }

    .hero-bg.loaded { transform: scale(1); }

    .hero-radial {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 65% 50%, rgba(201,168,76,0.07) 0%, transparent 55%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 780px;
      padding: 120px 5% 80px;
      animation: heroIn 1.1s ease both;
    }

    @keyframes heroIn {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .hero-eyebrow-line { width: 36px; height: 1px; background: var(--gold); }

    .hero-eyebrow-text {
      font-size: 0.68rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }

    .hero-h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.3rem, 5.2vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--white);
      margin-bottom: 24px;
    }

    .hero-h1 em { font-style: italic; color: var(--gold); }

    .hero-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 1.9vw, 1.3rem);
      font-weight: 300;
      color: var(--cream);
      line-height: 1.75;
      margin-bottom: 48px;
      max-width: 580px;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

    .hero-scroll {
      position: absolute;
      bottom: 36px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 2;
      animation: scrollBounce 2.2s ease-in-out infinite;
    }

    .hero-scroll-lbl {
      font-size: 0.58rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gray);
    }

    .hero-scroll-bar {
      width: 1px; height: 48px;
      background: linear-gradient(to bottom, var(--gold), transparent);
    }

    @keyframes scrollBounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(8px); }
    }

    .hero-stats {
      position: absolute;
      right: 5%; bottom: 80px;
      display: flex; flex-direction: column; gap: 20px;
      z-index: 2;
      animation: heroIn 1.2s 0.3s ease both;
    }

    .stat-card {
      text-align: right;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 6px;
      padding: 16px 22px;
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .stat-lbl {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray-light);
      margin-top: 5px;
    }

    /* ── MARQUEE ── */
    .marquee-wrap {
      background: var(--dark-2);
      border-top: 1px solid rgba(201,168,76,0.1);
      border-bottom: 1px solid rgba(201,168,76,0.1);
      padding: 16px 0;
      overflow: hidden;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }

    .marquee-track:hover { animation-play-state: paused; }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .mitem {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 0 36px;
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gray);
      white-space: nowrap;
    }

    .mdot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* ── ABOUT ── */
    #about {
      padding: 120px 5%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 90px;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .about-visual { position: relative; }

    .about-img {
      width: 100%; height: 520px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .about-img2 {
      position: absolute;
      bottom: -40px; right: -40px;
      width: 210px; height: 270px;
      object-fit: cover;
      border-radius: 4px;
      border: 5px solid var(--dark);
    }

    .about-badge {
      position: absolute;
      top: 36px; left: -28px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--black);
      padding: 18px 22px;
      border-radius: 4px;
      text-align: center;
    }

    .about-badge-num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      display: block;
    }

    .about-badge-txt {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
      display: block;
    }

    .about-feats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 40px;
    }

    .about-feat {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .feat-icon {
      width: 40px; height: 40px;
      border: 1px solid rgba(201,168,76,0.28);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
      background: rgba(201,168,76,0.05);
    }

    .feat-text h4 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--off-white);
      margin-bottom: 4px;
    }

    .feat-text p {
      font-size: 0.76rem;
      color: var(--gray);
      line-height: 1.5;
    }

    /* ── PRODUCTS ── */
    #products {
      padding: 120px 5%;
      background: var(--dark-2);
    }

    .products-hd {
      text-align: center;
      margin-bottom: 68px;
    }

    .products-hd .gold-line { margin: 20px auto 0; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .prod-card {
      position: relative;
      border-radius: 5px;
      overflow: hidden;
      aspect-ratio: 3/4;
      cursor: pointer;
    }

    .prod-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
      display: block;
    }

    .prod-card:hover img { transform: scale(1.08); }

    .prod-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.25) 55%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 26px 22px;
    }

    .prod-tag {
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 7px;
    }

    .prod-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .prod-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.3s;
    }

    .prod-card:hover .prod-link { opacity: 1; transform: translateY(0); }

    .prod-link .arr { transition: transform 0.3s; }
    .prod-card:hover .prod-link .arr { transform: translateX(4px); }

    /* ── WHY CHOOSE US ── */
    #why {
      padding: 120px 5%;
    }

    .why-inner { max-width: 1400px; margin: 0 auto; }

    .why-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: end;
      margin-bottom: 72px;
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
    }

    .why-card {
      background: var(--dark-3);
      padding: 38px 26px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      cursor: default;
    }

    .why-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s;
    }

    .why-card:hover::after { transform: scaleX(1); }
    .why-card:hover { background: var(--dark-4); transform: translateY(-4px); }

    .why-card-n {
      position: absolute;
      top: 14px; right: 18px;
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: rgba(201,168,76,0.06);
      line-height: 1;
      transition: color 0.4s;
    }

    .why-card:hover .why-card-n { color: rgba(201,168,76,0.13); }

    .why-ico { font-size: 2.2rem; margin-bottom: 18px; display: block; }

    .why-ttl {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--off-white);
      margin-bottom: 10px;
    }

    .why-dsc {
      font-size: 0.78rem;
      color: var(--gray);
      line-height: 1.7;
    }

    /* ── GALLERY / FEATURED PRODUCTS ── */
    #gallery {
      padding: 120px 5%;
      background: var(--dark-2);
    }

    .gallery-hd { text-align: center; margin-bottom: 68px; }
    .gallery-hd .gold-line { margin: 20px auto 0; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      max-width: 1400px;
      margin: 0 auto 48px;
    }

    .gal-card {
      background: var(--dark-3);
      border: 1px solid rgba(201,168,76,0.08);
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .gal-card:hover {
      border-color: rgba(201,168,76,0.32);
      transform: translateY(-6px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), var(--shadow-gold);
    }

    .gal-img {
      width: 100%; height: 252px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s;
    }

    .gal-card:hover .gal-img { transform: scale(1.05); }

    .gal-body { padding: 22px; }

    .gal-cat {
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .gal-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--off-white);
      margin-bottom: 8px;
    }

    .gal-desc {
      font-size: 0.78rem;
      color: var(--gray);
      line-height: 1.65;
      margin-bottom: 18px;
    }

    .gal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gal-price {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      color: var(--gold);
    }

    .gal-btn {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid
